<header style="margin-bottom: 30px;">
  
  <div class="container" style="display: flex; flex-direction: column; align-items: center;">
    <div style="display: flex; flex-direction: row; gap: 3px; justify-content: center; padding: 50px;"> 
    <h1 style="color: red;">R</h1>
    <h1 style="color: forestgreen;">S</h1>
    <h1 style="color: whitesmoke;">market</h1>
  </div>

    <div class="refeal" style="color: #ffffff; display: flex; flex-direction: row; gap: 10px;">
      <a>Serviços</a>
      <a>Promoções</a>
      <a>Mais vendidos</a>
      <a>Lançamentos</a>
      <a>Anuncie aqui</a>
    </div>
  </div>
</header>


<body>

<div class="container-cards">
<div *ngFor="let product of products" class="card">
  <h3>{{ product.name }}</h3>
  <p>{{ product.description }}</p>
  <p>Preço: {{ product.price }}</p>

  <small> 
    Criado por: {{ product.user.name }} ({{ product.user.email }})
  </small>
</div>
</div>

</body>
